  - title: "Recurrent Networks & LSTM — sequence foundations"
    passage: |
      A Recurrent Neural Network (RNN) processes a sequence one element at a time, maintaining a hidden state that summarizes everything it has seen so far. At each timestep t, the network computes a new hidden state h_t from the previous hidden state h_(t-1) and the current input x_t, then optionally produces an output y_t. The same weights are used at every timestep — recurrence is just weight-sharing across time.

      Training an RNN uses backpropagation through time (BPTT): the network is conceptually unrolled into a deep feedforward computation graph spanning the whole sequence, and gradients flow backward through every timestep. This is where vanilla RNNs run into trouble. Gradients flowing back through many timesteps repeatedly multiply by the same weight matrix, and unless the eigenvalues of that matrix are exactly one, the gradient magnitudes either explode or vanish exponentially. For sequences longer than about 20 to 30 timesteps, vanishing gradients make it impossible for the network to learn long-range dependencies.

      Long Short-Term Memory (LSTM) networks fix this by introducing a separate cell state alongside the hidden state, regulated by three gates: a forget gate that decides what to remove from the cell, an input gate that decides what new information to write, and an output gate that decides what to expose as the hidden state. Each gate is a small sigmoid-activated layer producing values between 0 and 1 — element-wise multipliers on the cell state.

      The crucial mathematical property is that the cell state has a near-linear path through time: information can flow forward across hundreds of timesteps without being repeatedly squashed by activation functions. Gradients can similarly flow backward through this highway without vanishing.

      During training, sequence models often use teacher forcing: instead of feeding the model's own output back as the next input, the ground-truth target token is fed in. This makes training more stable and parallelizable across the sequence length, at the cost of a train-vs-inference mismatch — the model never sees its own mistakes during training.
    interactions:
      - selected_text: "hidden state"
        question: "What is a hidden state in an RNN, and how is it different from the weights of the network?"
      - selected_text: "vanishing gradients"
        question: "Why do plain RNNs suffer from vanishing gradients on long sequences? Tie the explanation to the chain rule."
      - selected_text: "three gates"
