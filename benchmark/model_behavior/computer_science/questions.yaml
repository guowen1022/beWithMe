name: "CS student learning machine learning"

profile: |
  I'm a computer science senior. Strong in linear algebra and programming.
  New to deep learning. I prefer math-first explanations with code examples.

sessions:
  - title: "Neural Networks — Backpropagation"
    passage: |
      A neural network is a network of artificial neurons organized in layers. Each connection between neurons has a weight that is adjusted during training. The network learns by adjusting these weights to minimize a loss function.

      Backpropagation is the algorithm used to train neural networks. It computes the gradient of the loss function with respect to each weight by applying the chain rule, computing the gradient one layer at a time, iterating backward from the last layer.

      The gradient tells us how much the loss would change if we made a small change to each weight. We then update each weight in the direction that reduces the loss — this is gradient descent. The learning rate controls how big each step is.

      Stochastic gradient descent (SGD) computes the gradient using a random subset (mini-batch) of the training data rather than the entire dataset, which makes training much faster while still converging to a good solution.
    interactions:
      - selected_text: "adjusted during training"
        question: "What does 'training' actually mean mathematically?"
      - selected_text: "chain rule, computing the gradient one layer at a time"
        question: "Can you show me the chain rule applied to a simple 2-layer network?"
      - selected_text: "gradient descent"
        question: "What's the intuition behind gradient descent?"
      - selected_text: "learning rate controls how big each step is"
        question: "What happens if the learning rate is too high or too low?"
      - selected_text: "Stochastic gradient descent"
        question: "Why does using random mini-batches still work?"

  - title: "Transformers — Attention Mechanism"
    passage: |
      The Transformer is a deep learning architecture that relies entirely on self-attention mechanisms, dispensing with recurrence and convolutions entirely. It was introduced in the paper "Attention Is All You Need" by Vaswani et al. in 2017.

      Self-attention allows the model to weigh the importance of different words in a sequence when encoding each word. For each word, the model computes Query (Q), Key (K), and Value (V) vectors. The attention score between two words is the dot product of the query of one word with the key of the other, scaled by the square root of the dimension.

      Multi-head attention runs multiple attention computations in parallel, each with different learned projections. This allows the model to attend to information from different representation subspaces at different positions.

      The Transformer architecture uses positional encoding to inject information about the position of tokens in the sequence, since the self-attention mechanism is permutation-invariant.
    interactions:
      - selected_text: "relies entirely on self-attention mechanisms"
        question: "Why was removing recurrence such a big deal?"
      - selected_text: "Query (Q), Key (K), and Value (V) vectors"
        question: "What's the intuition behind Q, K, V? Why three separate vectors?"
      - selected_text: "dot product of the query of one word with the key of the other"
        question: "Can you show the attention computation with actual numbers?"
      - selected_text: "Multi-head attention"
        question: "Why do we need multiple heads? What does each one learn?"
      - selected_text: "positional encoding"
        question: "How does positional encoding work? Why sine/cosine?"
      - selected_text: null
        question: "How do transformers relate to the backpropagation we studied earlier?"

  - title: "Convolutional Neural Networks — vision foundations"
    passage: |
      A Convolutional Neural Network (CNN) replaces the dense matrix multiplications of an MLP with a sliding-window operation called a convolution. Each conv layer learns a small set of filters (also called kernels) — typically 3x3 or 5x5 — that are slid across the input and produce a 2D feature map for every channel. The weights of these filters are learned via backpropagation, exactly like in an MLP, but each filter is shared across every spatial position in the input.

      This weight sharing is what gives CNNs translation equivariance: if a feature (an edge, a corner, a face) shifts to a different location in the image, the same filter detects it without needing a separate set of weights for that location. Empirically this dramatically reduces the number of parameters needed to recognize patterns and makes CNNs especially well-suited to images and other grid-structured data.

      Modern CNNs stack many conv layers, each followed by a non-linearity (ReLU) and often a pooling operation. Max pooling takes the largest activation within a small window — say 2x2 — and discards the rest, halving the spatial resolution while making the network more robust to small spatial shifts. Padding with zeros around the edges keeps the output the same size as the input; without padding the feature maps shrink with each layer.

      The receptive field of a neuron in a deep conv layer — the region of the original input it can see — grows by roughly the kernel size with each layer, so stacking many 3x3 layers eventually sees as much as a single large kernel would, but with far fewer parameters: two 3x3 layers cover the same area as one 5x5 with 18 weights instead of 25.

      A conv layer typically has multiple channels, where each channel is a separate filter learning a different feature. The first layer may learn edge detectors and color blobs; deeper layers compose those into shapes, parts, and eventually whole-object detectors.
    interactions:
      - selected_text: "learned via backpropagation"
        question: "What does it mean for a convolution kernel to be 'learned'? Where do the filter weights actually come from?"
      - selected_text: "weight sharing"
        question: "Why is weight sharing the key idea that makes CNNs work for images, when a plain MLP would also fit the data in theory?"
      - selected_text: "translation equivariance"
        question: "What is translation equivariance, and how is it different from translation invariance?"
      - selected_text: "Max pooling"
        question: "Max pooling throws away information by design — why does that help generalization instead of hurting it?"
      - selected_text: "Padding with zeros"
        question: "Why do we pad with zeros around the edges? What goes wrong without padding when you stack many conv layers?"
      - selected_text: "receptive field"
        question: "Walk me through how the receptive field grows as I stack more conv layers. Why does that matter for what the network can recognize?"
      - selected_text: "two 3x3 layers cover the same area as one 5x5 with 18 weights instead of 25"
        question: "Show the parameter-count arithmetic for two 3x3 layers vs one 5x5 layer, and explain why 'deeper with smaller kernels' became the consistent design choice."
      - selected_text: null
