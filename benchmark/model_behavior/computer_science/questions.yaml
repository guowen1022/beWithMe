      - selected_text: "cell state has a near-linear path through time"
        question: "What does it mean that the cell state has a 'highway' for gradient flow? Why is that the trick that fixes vanishing gradients?"
      - selected_text: "teacher forcing"
        question: "What is teacher forcing and what's the train-vs-inference mismatch it creates?"
      - selected_text: "backpropagation through time"
        question: "What's BPTT, and how is it different from regular backprop on a feedforward network?"
      - selected_text: null
        question: "Transformers replaced RNNs for most language tasks — what was the single biggest advantage that made the switch happen?"

  - title: "Diffusion Models — generative AI"
    passage: |
      Diffusion models are a class of generative models that learn to reverse a gradual noising process. Given a training image x_0, the forward (or diffusion) process produces a sequence of progressively noisier versions x_1, x_2, ..., x_T by adding a small amount of Gaussian noise at each step. The noise schedule is chosen so that after T steps (usually around 1000), the original signal is essentially destroyed and x_T is indistinguishable from pure Gaussian noise.

      The reverse process is what the neural network learns. Instead of trying to predict the clean image x_0 directly from noise, the model is trained to predict the noise that was added at each step. This turns out to be much easier than predicting the image itself, because the noise at each step is small and Gaussian. Once the model can predict the noise at any timestep, sampling proceeds by starting from pure noise and iteratively subtracting the predicted noise step-by-step, gradually revealing a coherent image.

      The denoising network is typically a U-Net, a fully convolutional architecture with skip connections between matching encoder and decoder layers. The U-Net is well-suited because it operates at multiple spatial resolutions, capturing both fine details and global structure, and the skip connections let the network preserve spatial information that would otherwise be lost in the bottleneck.

      Mathematically, the training objective is connected to score matching: the network is implicitly learning the score function — the gradient of the log-probability of the data distribution at every noise level. This is why diffusion models can be reframed as solving a stochastic differential equation in reverse, and it gives them a principled probabilistic foundation that GANs lack.

      Conditioning a diffusion model on text — as in "a cat astronaut on the moon" — is done by feeding a text embedding into the denoising U-Net at every step, usually via cross-attention. The network learns to steer the denoising toward images consistent with the prompt. Classifier-free guidance, the most common conditioning trick, mixes a conditional and unconditional prediction at sampling time to amplify the influence of the prompt without needing a separate classifier model.
    interactions:
      - selected_text: "forward (or diffusion) process"
        question: "Walk me through the forward noising process step by step. Why does the noise have to be Gaussian specifically?"
      - selected_text: "predict the noise that was added at each step"
