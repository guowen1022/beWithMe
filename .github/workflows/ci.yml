name: CI

# Fast, hermetic checks on every PR and push to main.
# Nothing here touches a cloud account or needs a secret.
#
# The `arch` job is the interesting one: it enforces the dependency invariants
# ARCHITECTURE.md section 9 declares as law, so a PR that breaks the layer model
# fails before review.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # infra/model/llm.py and infra/model/vision/__init__.py validate their
  # provider vars at IMPORT time and raise RuntimeError when unset. Tests are
  # hermetic and never make a real call, so CI seeds throwaway values purely to
  # let `import infra...` succeed. These are not secrets and must stay fake.
  LLM_PROVIDER: deepseek
  DEEPSEEK_API_KEY: ci-not-a-real-key
  DEEPSEEK_BASE_URL: https://api.deepseek.com
  DEEPSEEK_MODEL: deepseek-chat
  VISION_PROVIDER: doubao
  DOUBAO_API_KEY: ci-not-a-real-key
  DOUBAO_BASE_URL: https://ark.cn-beijing.volces.com/api/v3
  DOUBAO_VISION_MODEL: doubao-seed-2-0-lite-260428

jobs:
  # ---------------------------------------------------------------------------
  arch:
    name: Architecture invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pure stdlib (ast) — no dependency install needed, so this is the
      # fastest signal in the pipeline and gates nothing behind pip.
      - name: Dependency graph (ARCHITECTURE.md section 9, invariants 1-4)
        run: python scripts/check_arch.py --list

  # ---------------------------------------------------------------------------
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ffmpeg is a hard prerequisite for services/transcribe + infra/media
      # (CLAUDE.md > Prerequisites). Some unit tests import those modules.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # tests/unit is hermetic: the root conftest pins the skillforge adapter to
      # its default-off baseline, and no unit test needs Postgres or Ollama.
      # tests/e2e DOES need the full topology and runs in the e2e workflow.
      - name: Run unit tests
        run: pytest tests/unit -q

      # The user-data map guard (ARCHITECTURE.md section 2.6) is the invariant that
      # catches a new user-data store that forgot to register itself. Called out
      # separately so a failure here is unmistakable in the log.
      - name: User-data map guard (section 2.6)
        run: pytest tests/unit/test_user_data_map.py -q

  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` needs a lockfile; fall back to `install` so this job is useful
      # even before one is committed.
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
