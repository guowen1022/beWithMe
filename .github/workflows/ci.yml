name: CI

# Every PR and push to main. No cloud account, no secrets.
#
# Shape:
#   arch      -- ARCHITECTURE.md section 9 invariants (fastest signal, no deps)
#   service   -- 8 jobs, one per sidecar: install ITS dependencies, boot it
#   unit      -- the whole unit suite once
#   client    -- 3 jobs: web (Next.js), desktop (Electron), mobile (Expo/RN)
#
# The per-service matrix is the point: unit-test coverage is uneven (shell,
# speak and browser have no tests), so `scripts/smoke_service.py` proves each
# sidecar's dependency chain actually imports and mounts an app.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # infra/model/llm.py:45 and infra/model/vision/__init__.py:30 validate their
  # provider vars at IMPORT time and raise RuntimeError when unset. Every job
  # below imports application code, so CI seeds throwaway values purely to let
  # the import succeed. Tests never make a real call -- these must stay fake.
  LLM_PROVIDER: deepseek
  DEEPSEEK_API_KEY: ci-not-a-real-key
  DEEPSEEK_BASE_URL: https://api.deepseek.com
  DEEPSEEK_MODEL: deepseek-chat
  VISION_PROVIDER: doubao
  DOUBAO_API_KEY: ci-not-a-real-key
  DOUBAO_BASE_URL: https://ark.cn-beijing.volces.com/api/v3
  DOUBAO_VISION_MODEL: doubao-seed-2-0-lite-260428

jobs:
  # ===========================================================================
  arch:
    name: Architecture invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pure stdlib (ast) -- no pip install, so this fails fast and cheap.
      - name: Dependency graph (invariants 1-4)
        run: python scripts/check_arch.py --list

  # ===========================================================================
  # One job per sidecar. `fail-fast: false` so a break in `speak` still tells
  # you whether `browser` is healthy in the same run.
  service:
    name: ${{ matrix.service }} (+${{ matrix.offset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Offsets mirror infra/topology.py:SERVICE_OFFSETS.
          - { service: shell,      offset: 0, media: false }
          - { service: persona,    offset: 1, media: false }
          - { service: knowledge,  offset: 2, media: false }
          - { service: transcribe, offset: 3, media: true  }
          - { service: speak,      offset: 4, media: true  }
          - { service: browser,    offset: 5, media: true  }
          - { service: maestro,    offset: 6, media: false }
          - { service: tuning,     offset: 8, media: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ffmpeg/ffprobe is a hard prerequisite for transcribe + infra/media
      # (CLAUDE.md > Prerequisites). Only the media sidecars pay this cost.
      - name: System dependencies (media sidecars)
        if: matrix.media
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # services/browser drives Playwright; install the actual browser so a
      # missing system library shows up here rather than at runtime.
      - name: Chromium (browser sidecar)
        if: matrix.service == 'browser'
        run: playwright install --with-deps chromium

      # The real per-service check: import the sidecar and confirm it mounts.
      - name: Boot smoke test
        run: python scripts/smoke_service.py ${{ matrix.service }}

      # Run whichever unit tests mention this service. Not every sidecar has
      # them -- `--ignore-missing` semantics via the `|| true` on the collect
      # step would hide real failures, so instead we skip cleanly when the
      # match set is empty and fail loudly when it is not.
      - name: Service-scoped tests
        shell: bash
        run: |
          mapfile -t files < <(grep -rl "services\.${{ matrix.service }}\|services/${{ matrix.service }}" tests/unit || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no unit tests reference services/${{ matrix.service }} -- boot smoke test is the only gate"
            exit 0
          fi
          echo "running ${#files[@]} test file(s):"
          printf '  %s\n' "${files[@]}"
          pytest "${files[@]}" -q

  # ===========================================================================
  unit:
    name: Unit suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Node + the frontend's packages are NOT optional for this job. The
      # note/mermaid/text-display render paths shell out to Node and load
      # mermaid straight from the frontend tree
      # (infra/render/mermaid.py: frontend/node_modules/mermaid/dist/mermaid.min.js),
      # so ~49 unit tests fail with "mermaid module not found" without them.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend packages (needed by the render tests)
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # The same render path rasterises through headless Chromium, so the
      # browser binary is required too, not just the mermaid package.
      - name: Chromium (needed by the render tests)
        run: playwright install --with-deps chromium

      # tests/unit is otherwise hermetic: the root conftest pins the skillforge
      # adapter to its default-off baseline and nothing needs Postgres or Ollama.
      # tests/e2e needs the full running topology and lives in its own workflow.
      - name: Unit tests
        run: pytest tests/unit -q

      # Called out separately so a failure is unmistakable in the log: this is
      # the guard that catches a new user-data store that forgot to register
      # itself (ARCHITECTURE.md section 2.6).
      - name: User-data map guard
        run: pytest tests/unit/test_user_data_map.py -q

  # ===========================================================================
  # Three client surfaces, three jobs. All Node, but different toolchains:
  # Next.js build, Electron tsc, Expo/React Native typecheck.
  client:
    name: "client: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: web,     dir: frontend }
          - { name: desktop, dir: desktop  }
          - { name: mobile,  dir: mobile   }
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    env:
      # frontend/eslint.config.mjs pulls in eslint-config-next/typescript, which
      # is type-aware: typescript-eslint builds a full program for the project.
      # That legitimately needs several GB and OOMs (exit 134) at both Node's
      # ~2GB default and 4GB. Runners have 16GB, so give it 8.
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # Only the web client defines `lint`; skip quietly elsewhere rather than
      # failing on a script that was never meant to exist.
      - name: Lint
        run: npm run --if-present lint

      # web     -> next build
      # desktop -> tsc -p tsconfig.json (compiles the Electron main process)
      # mobile  -> no build script; typecheck instead. `expo prebuild` needs the
      #            Android SDK, which is out of scope for a PR gate.
      - name: Build / typecheck
        run: |
          if npm run | grep -qE '^  build'; then
            npm run build
          else
            npx --yes tsc --noEmit -p tsconfig.json
          fi
